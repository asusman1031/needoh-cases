<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Queue — NeeDoh Cases</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2242%22 fill=%22%23E8704A%22/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FAF5EC; --card: #FFFFFF; --ink: #33302B; --muted: #8B857A;
    --line: #E7DFD2; --green: #3E5C42; --coral: #E8704A; --sun: #F3C64F;
    --shadow: 0 1px 2px rgba(51,48,43,.05), 0 8px 24px rgba(51,48,43,.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', system-ui, sans-serif;
    font-weight: 600;
    color: var(--ink);
    background: var(--cream);
    min-height: 100vh;
    padding: 36px 18px 64px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 30px; text-align: center; margin-bottom: 22px; }
  #login { text-align: center; margin-top: 56px; }
  #login input {
    font: inherit; font-size: 17px; padding: 12px 16px;
    border: 1.5px solid var(--line); border-radius: 12px; width: 230px; background: #fff;
  }
  #login input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px rgba(62,92,66,.14); }
  #login button, .refresh {
    font: inherit; font-weight: 800; font-size: 15px;
    padding: 12px 22px; margin-left: 8px;
    border: none; border-radius: 999px;
    background: var(--green); color: #fff; cursor: pointer;
  }
  #login button:hover, .refresh:hover { background: #32503a; }
  #login .msg { margin-top: 12px; color: #A34424; font-weight: 700; min-height: 22px; font-size: 14.5px; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .toolbar .count { font-weight: 800; color: var(--muted); font-size: 14.5px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 18px 20px; margin-bottom: 12px; box-shadow: var(--shadow);
  }
  .card.done { opacity: .55; }
  .card .head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 6px; }
  .card .who { font-size: 17px; font-weight: 800; }
  .card .who small { color: var(--muted); font-size: 12.5px; font-weight: 700; }
  .card .when { font-size: 12.5px; color: var(--muted); }
  .card .spec { margin-top: 8px; line-height: 1.65; font-size: 14.5px; }
  .card .spec a { color: var(--green); }
  .tag {
    display: inline-block; padding: 2px 11px; border-radius: 999px;
    font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase;
  }
  .tag.new { background: #FBEADF; color: var(--coral); }
  .tag.printing { background: #EAF0F6; color: #3F6A96; }
  .tag.done { background: #EEF2EC; color: var(--green); }
  .statusBtns { margin-top: 12px; display: flex; gap: 8px; }
  .statusBtns button {
    font: inherit; font-weight: 800; font-size: 13px;
    padding: 7px 14px; border: 1.5px solid var(--line); border-radius: 999px;
    background: #FDFBF7; cursor: pointer; color: var(--ink);
  }
  .statusBtns button:hover { border-color: var(--green); color: var(--green); }
  .empty { text-align: center; color: var(--muted); font-size: 17px; margin-top: 40px; }
  #queue { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Order Queue</h1>

  <div id="login">
    <input type="password" id="passcode" placeholder="Passcode" onkeydown="if(event.key==='Enter')loadOrders()">
    <button onclick="loadOrders()">Open</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <div id="queue">
    <div class="toolbar">
      <span class="count" id="count"></span>
      <button class="refresh" onclick="loadOrders()">Refresh</button>
    </div>
    <div id="list"></div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://zwiqmrlquldhjjwbeakj.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3aXFtcmxxdWxkaGpqd2JlYWtqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4Mjg2NzUsImV4cCI6MjA5MTQwNDY3NX0.LCwK85CoEJFEG2NqF5DZ5iZGCOoi3BxzhbGhlYwA6es";

function getPasscode() {
  return document.getElementById("passcode").value || sessionStorage.getItem("needoh_pass") || "";
}

async function rpc(fn, args) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: "POST",
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json"
    },
    body: JSON.stringify(args)
  });
  if (!res.ok) throw new Error(await res.text());
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function loadOrders() {
  const pass = getPasscode();
  const msg = document.getElementById("loginMsg");
  msg.textContent = "";
  let orders;
  try {
    orders = await rpc("get_needoh_orders", { passcode: pass });
  } catch (e) {
    msg.textContent = "Couldn't load orders — check the passcode.";
    return;
  }
  sessionStorage.setItem("needoh_pass", pass);
  document.getElementById("login").style.display = "none";
  document.getElementById("queue").style.display = "block";

  const open = orders.filter(o => o.status !== "done").length;
  document.getElementById("count").textContent =
    `${orders.length} order${orders.length === 1 ? "" : "s"} · ${open} open`;

  const list = document.getElementById("list");
  if (!orders.length) {
    list.innerHTML = '<div class="empty">No orders yet. Share the form link!</div>';
    return;
  }
  list.innerHTML = orders.map(o => `
    <div class="card ${o.status === "done" ? "done" : ""}">
      <div class="head">
        <span class="who">${esc(o.customer_name)}${o.order_code ? ` <small>${esc(o.order_code)}</small>` : ""} <span class="tag ${o.status}">${o.status}</span></span>
        <span class="when">${new Date(o.created_at).toLocaleString()}</span>
      </div>
      <div class="spec">
        <b>${esc(o.case_style)}</b> × ${o.quantity} · for ${esc(o.needoh_types || o.needoh_type || "?")}<br>
        ${o.colors ? `Colors: ${esc(o.colors)}<br>` : ""}
        ${o.design ? `Design: ${esc(o.design)}` : (o.with_logo ? "With logo" : "No logo")}${o.personalization ? ` — "${esc(o.personalization)}"${o.font ? ` (${esc(o.font)})` : ""}` : ""}<br>
        ${o.order_type ? `${esc(o.order_type)}${o.ship_address ? ` — ${esc(o.ship_address)}` : ""}<br>` : ""}
        ${o.payment_method ? `Pay by ${esc(o.payment_method)}<br>` : ""}
        ${o.needed_by ? `Needed by ${esc(o.needed_by)}<br>` : ""}
        ${o.notes ? `Notes: ${esc(o.notes)}<br>` : ""}
        ${o.photo_url ? `<a href="${esc(o.photo_url)}" target="_blank" rel="noopener">View their NeeDoh photo</a><br>` : ""}
        Contact: ${esc(o.contact)}${o.preferred_contact ? ` (prefers ${esc(o.preferred_contact).toLowerCase()})` : ""}${o.social_handle ? ` · ${esc(o.social_handle)}` : ""}
      </div>
      <div class="statusBtns">
        <button onclick="setStatus('${o.id}','new')">New</button>
        <button onclick="setStatus('${o.id}','printing')">Printing</button>
        <button onclick="setStatus('${o.id}','done')">Done</button>
      </div>
    </div>
  `).join("");
}

async function setStatus(id, status) {
  try {
    await rpc("set_needoh_order_status", {
      passcode: getPasscode(), order_id: id, new_status: status
    });
    loadOrders();
  } catch (e) {
    alert("Couldn't update status. Try refreshing.");
  }
}

if (sessionStorage.getItem("needoh_pass")) loadOrders();
</script>
</body>
</html>
