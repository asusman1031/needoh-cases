<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery Photos — NeeDoh Cases</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FAF5EC; --card: #fff; --ink: #33302B; --muted: #8B857A;
    --line: #E7DFD2; --green: #3E5C42;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', system-ui, sans-serif; font-weight: 600;
    color: var(--ink); background: var(--cream);
    min-height: 100vh; padding: 40px 18px;
  }
  .wrap { max-width: 520px; margin: 0 auto; text-align: center; }
  h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 28px; margin-bottom: 6px; }
  p.sub { color: var(--muted); font-size: 15px; margin-bottom: 26px; }
  .slot {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 18px; margin-bottom: 16px; text-align: left;
  }
  .slot h2 { font-size: 16px; font-weight: 800; margin-bottom: 10px; }
  .slot img {
    width: 100%; border-radius: 12px; display: block;
    object-fit: cover; aspect-ratio: 4/3; background: #FDFBF7; margin-bottom: 10px;
  }
  input[type=file] { width: 100%; font: inherit; font-size: 14px; color: var(--muted); }
  .status { font-size: 14px; font-weight: 700; margin-top: 8px; min-height: 20px; }
  .status.ok { color: var(--green); }
  .status.err { color: #A34424; }
  a.back { color: var(--green); font-weight: 800; font-size: 14.5px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Homepage gallery photos</h1>
  <p class="sub">Pick a photo for each slot — it uploads straight to the site. Refresh the homepage after to see it live.</p>

  <div class="slot">
    <h2>Photo 1 (left)</h2>
    <img id="img1" src="" alt="" onerror="this.style.display='none'">
    <input type="file" accept="image/*" onchange="upload(this, 1)">
    <div class="status" id="status1"></div>
  </div>

  <div class="slot">
    <h2>Photo 2 (right)</h2>
    <img id="img2" src="" alt="" onerror="this.style.display='none'">
    <input type="file" accept="image/*" onchange="upload(this, 2)">
    <div class="status" id="status2"></div>
  </div>

  <a class="back" href="./">← Back to the order form</a>
</div>

<script>
const SUPABASE_URL = "https://zwiqmrlquldhjjwbeakj.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3aXFtcmxxdWxkaGpqd2JlYWtqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4Mjg2NzUsImV4cCI6MjA5MTQwNDY3NX0.LCwK85CoEJFEG2NqF5DZ5iZGCOoi3BxzhbGhlYwA6es";
const publicUrl = n => `${SUPABASE_URL}/storage/v1/object/public/needoh-photos/gallery-${n}.jpg`;

// show current photos (cache-busted)
for (const n of [1, 2]) {
  const img = document.getElementById("img" + n);
  img.src = publicUrl(n) + "?t=" + Date.now();
}

async function upload(input, n) {
  const file = input.files[0];
  const status = document.getElementById("status" + n);
  if (!file) return;
  if (file.size > 8 * 1024 * 1024) {
    status.textContent = "That photo is over 8MB — try a smaller one.";
    status.className = "status err";
    return;
  }
  status.textContent = "Uploading…";
  status.className = "status";
  try {
    const res = await fetch(`${SUPABASE_URL}/storage/v1/object/needoh-photos/gallery-${n}.jpg`, {
      method: "POST",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`,
        "Content-Type": file.type || "image/jpeg",
        "x-upsert": "true"
      },
      body: file
    });
    if (!res.ok) throw new Error(await res.text());
    status.textContent = "Uploaded! It's live on the homepage.";
    status.className = "status ok";
    const img = document.getElementById("img" + n);
    img.style.display = "block";
    img.src = publicUrl(n) + "?t=" + Date.now();
  } catch (e) {
    console.error(e);
    status.textContent = "Upload failed — try again.";
    status.className = "status err";
  }
}
</script>
</body>
</html>
